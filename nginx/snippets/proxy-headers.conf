# The bare minimum a reverse proxy must do to be honest with its backends.
# Included by most location blocks in nginx.conf. Lab 1 explains each line.

# Preserve the hostname the CLIENT asked for. Without this, nginx sends the
# UPSTREAM's name ("echo1:8080"), which breaks any backend that generates
# absolute URLs, does virtual hosting, or validates the Host header.
proxy_set_header Host              $host;

# Who is really calling. $remote_addr from the backend's point of view is the
# gateway, so it has to be told out of band.
proxy_set_header X-Real-IP         $remote_addr;

# The chain of proxies. $proxy_add_x_forwarded_for APPENDS to any existing
# header rather than replacing it, so multi-hop chains stay intact.
#
# Security note: a client can forge this header. A real edge gateway must
# either strip it on ingress or only trust it from known proxy IPs. See lab 1.
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

# Was the ORIGINAL request encrypted? The backend cannot tell, because the
# gateway terminated TLS and is now speaking plain http to it.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# A per-request ID for correlating gateway logs with backend logs. nginx
# generates $request_id itself (a random hex string) when the client did not
# supply one.
proxy_set_header X-Request-ID      $request_id;

# nginx talks HTTP/1.0 to upstreams by default, which disables keep-alive,
# chunked request bodies, and WebSocket upgrades. Almost nobody wants that.
proxy_http_version 1.1;
