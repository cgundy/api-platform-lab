worker_processes  auto;
error_log  /dev/stderr  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Access log. Read this constantly - it is the main instrument in this lab.
    #
    #   upstream=   which backend actually served it (proves load balancing)
    #   ustatus=    what the backend said (may differ from $status after retries)
    #   rt=         total time the client waited
    #   urt=        time the backend took (rt - urt = time nginx spent)
    #   cache=      HIT / MISS / BYPASS / EXPIRED / STALE
    # -------------------------------------------------------------------------
    log_format  lab  '$remote_addr "$request" -> $status '
                     'upstream=$upstream_addr ustatus=$upstream_status '
                     'rt=$request_time urt=$upstream_response_time '
                     'cache=$upstream_cache_status rid=$request_id';

    access_log  /dev/stdout  lab;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    # =========================================================================
    # UPSTREAM POOLS  (lab 03)
    # A pool is a named group of backends. nginx load balances across them.
    # =========================================================================
    upstream users_pool {
        # Shared memory for this pool's runtime state. Without it, EACH nginx
        # worker keeps its own round-robin counter and its own view of which
        # backends are healthy - so with 10 workers you effectively have 10
        # independent load balancers. Sequential curls then all hit the first
        # backend, because each request lands on a different idle worker that
        # starts counting from zero. Lab 3 has an exercise that proves it.
        zone users_pool 64k;

        # LAB 3 step 5: uncomment to switch from round-robin to fewest-active.
        # least_conn;

        # LAB 3 step 6: uncomment to pin a client to one backend by IP hash.
        # ip_hash;

        # LAB 3 step 7: add weight=3 to users1 below and watch the ratio change.
        # LAB 3 step 8: add max_fails=2 fail_timeout=10s for passive health checks.
        server users1:8080;
        server users2:8080;

        # LAB 3 step 9: connection reuse to the backends. Without this, nginx
        # opens a fresh TCP connection per request.
        # keepalive 32;
    }

    upstream orders_pool {
        # Note: NOT orders:8080. Traffic goes through toxiproxy so you can
        # damage the network at runtime without touching this file.
        server toxiproxy:21001;
    }

    upstream flaky_pool {
        zone flaky_pool 64k;
        server flaky1:8080;
        server flaky2:8080;
    }

    # =========================================================================
    # SHARED MEMORY ZONES
    # Declared here, but nothing uses them until you enable a directive in a
    # location block below. Declaring an unused zone is harmless.
    # =========================================================================

    # lab 05 - response cache on disk, with an in-memory key index
    proxy_cache_path /var/cache/nginx/lab
                     levels=1:2
                     keys_zone=lab_cache:10m
                     max_size=100m
                     inactive=60m
                     use_temp_path=off;

    # lab 06 - request rate, keyed by client IP
    limit_req_zone $binary_remote_addr zone=perip:10m rate=5r/s;

    # lab 06 - request rate, keyed by API key header. A request with no
    # X-Api-Key header has an empty key, and nginx skips limiting entirely.
    # That is a real and very common misconfiguration - see lab 06 step 7.
    limit_req_zone $http_x_api_key zone=perkey:10m rate=2r/s;

    # lab 06 - concurrent connections, keyed by client IP
    limit_conn_zone $binary_remote_addr zone=perip_conn:10m;

    # =========================================================================
    # THE GATEWAY
    # =========================================================================
    server {
        listen       80 default_server;
        server_name  _;

        # Gotcha worth knowing: add_header does NOT merge down into a location
        # that has its own add_header. If a location below sets one, this
        # header disappears there. This trips up nearly everyone once.
        add_header X-Gateway "nginx-lab" always;

        location = / {
            default_type text/plain;
            return 200 "api platform lab gateway\n\ntry:\n  /users/\n  /orders/delay/1\n  /flaky/status/200:0.5,500:0.5\n  /healthz\n";
        }

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # =====================================================================
        # LAB 1 - what a proxy actually does
        #
        # /lab1/  is a deliberately naked proxy_pass: no headers set, no
        #         HTTP/1.1, nothing. The backend cannot tell who called it.
        # /lab1-fixed/  is the same thing done properly. Diff the two.
        # =====================================================================
        location /lab1/ {
            proxy_pass http://users1:8080/;
        }

        location /lab1-fixed/ {
            include /etc/nginx/snippets/proxy-headers.conf;
            proxy_pass http://users1:8080/;
        }

        # =====================================================================
        # LAB 2 - how nginx picks a location block
        #
        # Precedence is NOT top-to-bottom. It is:
        #   1. exact match           location = /path
        #   2. longest prefix with   location ^~ /path
        #   3. first matching regex  location ~ /path   (in file order)
        #   4. longest plain prefix  location /path
        # =====================================================================
        location = /match/exact {
            default_type text/plain;
            return 200 "matched: exact  (location = /match/exact)\n";
        }

        location ^~ /match/stop/ {
            default_type text/plain;
            return 200 "matched: prefix-that-stops-regex  (location ^~ /match/stop/)\n";
        }

        # Note the message below does not contain a literal '$'. nginx expands
        # variables inside quoted strings, so a stray '$' in a return value is
        # a config error: "invalid variable name". There is no escape for it -
        # you have to avoid it or build it with a map.
        location ~ ^/match/[a-z]+/re$ {
            default_type text/plain;
            return 200 "matched: regex  (location ~ ^/match/[a-z]+/re + end anchor)\n";
        }

        location /match/ {
            default_type text/plain;
            return 200 "matched: plain prefix  (location /match/)\n";
        }

        # ---------------------------------------------------------------------
        # LAB 2 - the trailing slash on proxy_pass changes the upstream path.
        #
        #   proxy_pass http://pool/;   the location prefix is STRIPPED
        #   proxy_pass http://pool;    the full original path is PASSED THROUGH
        #
        # Request /strip/headers  and /nostrip/headers hit different backend
        # paths. This one line causes a large share of real 404s.
        # ---------------------------------------------------------------------
        location /strip/ {
            include /etc/nginx/snippets/proxy-headers.conf;
            proxy_pass http://users_pool/;
        }

        location /nostrip/ {
            include /etc/nginx/snippets/proxy-headers.conf;
            proxy_pass http://users_pool;
        }

        # =====================================================================
        # LAB 3 - load balancing.  Watch upstream= in the access log.
        # =====================================================================
        location /users/ {
            include /etc/nginx/snippets/proxy-headers.conf;
            proxy_pass http://users_pool/;
        }

        # =====================================================================
        # LAB 4 - timeouts and retries
        #
        # /orders/  goes through toxiproxy, so you can make the NETWORK slow.
        # /flaky/   has two backends that return 500s, so nginx has somewhere
        #           to retry TO.
        # =====================================================================
        location /orders/ {
            include /etc/nginx/snippets/proxy-headers.conf;

            # LAB 4 step 3: without these, nginx waits 60s by default.
            # proxy_connect_timeout 2s;
            # proxy_send_timeout    2s;
            # proxy_read_timeout    2s;

            proxy_pass http://orders_pool/;
        }

        location /flaky/ {
            include /etc/nginx/snippets/proxy-headers.conf;

            # LAB 4 step 6: retry the OTHER backend on failure.
            # Careful: retrying non-idempotent requests can double-charge a
            # customer. That is what non_idempotent below controls.
            # proxy_next_upstream         error timeout http_500 http_502 http_503;
            # proxy_next_upstream_tries   3;
            # proxy_next_upstream_timeout 5s;

            proxy_pass http://flaky_pool/;
        }

        # =====================================================================
        # LAB 5 - caching.  X-Cache-Status shows HIT/MISS on every response.
        # =====================================================================
        location /cached/ {
            include /etc/nginx/snippets/proxy-headers.conf;

            add_header X-Cache-Status $upstream_cache_status always;

            # LAB 5 step 3: turn the cache on.
            # proxy_cache       lab_cache;
            # proxy_cache_key   "$scheme$request_method$host$request_uri";
            # proxy_cache_valid 200 30s;

            # LAB 5 step 6: collapse a stampede - only one request goes to the
            # backend on a miss, the rest wait for it.
            # proxy_cache_lock on;

            # LAB 5 step 7: serve stale content rather than an error when the
            # backend is broken. This is the single highest-value cache setting.
            # proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
            # proxy_cache_background_update on;

            proxy_pass http://orders_pool/;
        }

        # =====================================================================
        # LAB 6 - rate limiting
        # =====================================================================
        location /limited/ {
            include /etc/nginx/snippets/proxy-headers.conf;

            # LAB 6 step 3: 5 requests/second, allow a burst of 5 queued.
            #   (no nodelay) -> bursts are DELAYED, smoothing traffic
            #   nodelay      -> bursts are served instantly, then 429
            # limit_req        zone=perip burst=5 nodelay;
            # limit_req_status 429;

            proxy_pass http://users_pool/;
        }

        location /limited-by-key/ {
            include /etc/nginx/snippets/proxy-headers.conf;

            # LAB 6 step 7: per-API-key quota instead of per-IP.
            # limit_req        zone=perkey burst=2 nodelay;
            # limit_req_status 429;

            proxy_pass http://users_pool/;
        }

        location /concurrent/ {
            include /etc/nginx/snippets/proxy-headers.conf;

            # LAB 6 step 9: cap simultaneous in-flight requests, not rate.
            # limit_conn        perip_conn 2;
            # limit_conn_status 429;

            proxy_pass http://orders_pool/;
        }

        # =====================================================================
        # LAB 7 - uncomment to force everything to HTTPS.
        # Do this only AFTER the 443 server block below is live, or you will
        # lock yourself out of the gateway.
        # =====================================================================
        # location /secure/ {
        #     return 301 https://$host:8443$request_uri;
        # }
    }

    # =========================================================================
    # LAB 7 - TLS termination.
    #
    # 1. run  bin/setup-certs.sh
    # 2. uncomment this whole block
    # 3. docker compose restart gateway
    # 4. curl -k https://localhost:8443/users/
    #
    # "Termination" means TLS stops here: the gateway decrypts, then talks
    # plain HTTP to the backends. Check X-Forwarded-Proto on the echo output
    # to see how the backend learns the original request was encrypted.
    # =========================================================================
    # server {
    #     listen       443 ssl;
    #     http2        on;
    #     server_name  localhost;
    #
    #     ssl_certificate     /etc/nginx/certs/lab.crt;
    #     ssl_certificate_key /etc/nginx/certs/lab.key;
    #
    #     ssl_protocols             TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache         shared:SSL:10m;
    #     ssl_session_timeout       10m;
    #
    #     # LAB 7 step 6: HSTS. Tells browsers to never use http again.
    #     # add_header Strict-Transport-Security "max-age=31536000" always;
    #
    #     location / {
    #         include /etc/nginx/snippets/proxy-headers.conf;
    #         proxy_pass http://users_pool/;
    #     }
    # }
}
